; Stage-isolated Fallout 4 OG startup diagnostic. NO QUEST WRITES.
; ONLY ONE MODE may be YES per launch. Multiple YES = all disabled.
; Stage A (default): subscribes to vanilla TESQuestEvent; no F4SE tasks.
; Stage B: set event NO and one-shot YES; no event sink or permanent task.
; Stage C is permanently retired. F4SE 0.6.23 does NOT implement
; AddTaskPermanent although pinned CommonLibF4 declares it.
; Permanent YES is rejected by the updated test source, even alone.
; Always exit the game and relaunch after changing this file.
[Diagnostics]
EnableEventSink=YES
EnableOneShotTask=NO
EnablePermanentTask=NO
